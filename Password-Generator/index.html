<html lang="en">
    <head>
        <title>Password Generator</title>
        <link rel="stylesheet" href="./index.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <p class="generate-word">Generate a</p>
            <p class="password-word">random password</p>
            <p class="insecure-word">Never use an insecure password again.</p>
            <button class="password-button" onclick="passwordGenerator()">Generate passwords</button>
            <hr class="line">
            <div class="password-container">
                <div id="password1"></div>
                <div id="password2"></div>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
